name: FIS daily update
 
on:
  schedule:
    - cron: "0 5 * * *"     # 06:00 CET: results of the previous day
    - cron: "0 19 * * *"    # 20:00 CET: start lists published in the evening
  workflow_dispatch:        # lets you run it by hand from the Actions tab
 
permissions:
  contents: write
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 pandas
      - uses: actions/cache@v4
        with:
          path: fis_cache
          key: fis-cache-${{ github.run_id }}
          restore-keys: fis-cache-
      - run: python daily.py --days 3
      - name: Save new data to the repository
        run: |
          git config user.name "fis-bot"
          git config user.email "fis-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "FIS update $(date -u +%Y-%m-%dT%H:%M)"
          git push
